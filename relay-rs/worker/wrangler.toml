# Local runs only: `wrangler dev --local` after `worker-build --release`.
# Deliberately no account_id, routes or secrets. Nothing here deploys.
name = "bp-relay-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-15"

# The JS Worker's public directory, served through the ASSETS binding. The Worker runs first, so
# the gate decides before any file goes out. Read-only here: the JS Worker's files are not changed.
[assets]
directory = "../../worker/public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[durable_objects]
bindings = [{ name = "RELAY", class_name = "Relay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
