[package]
name = "bp-relay-server"
description = "Native axum and tokio shell of the BubblePlay relay: config, state files, subcommands, static assets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bp_relay_server"
path = "src/lib.rs"

[[bin]]
name = "bp-relay"
path = "src/main.rs"

[features]
default = []
# Lab routes for local testing only. Off by default. When on, serve refuses any non-loopback listen address.
lab = []

[dependencies]
axum = "0.8"
base64 = "0.22"
bp-device-key = { path = "../../crates/bp-device-key" }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
ipnet = "2"
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
