name: bubbleplay_app
description: BubblePlay for Windows and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  rust_lib_bubbleplay_app:
    path: rust_builder
  bb_ui:
    git:
      url: https://github.com/BubbleBuffer/bb-ui.git
      ref: v0.7.0
      path: packages/bb_ui
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.13

flutter:
  uses-material-design: false
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque[opsz,wdth,wght].ttf
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext[wght].ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic[wght].ttf
          style: italic
    - family: Fragment Mono
      fonts:
        - asset: assets/fonts/FragmentMono-Regular.ttf
        - asset: assets/fonts/FragmentMono-Italic.ttf
          style: italic
