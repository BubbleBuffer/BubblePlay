name: bubbleplay_app
description: BubblePlay for Windows and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  rust_lib_bubbleplay_app:
    path: rust_builder
  bb_ui:
    git:
      url: https://github.com/BubbleBuffer/bb-ui.git
      ref: v0.7.0
      path: packages/bb_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
