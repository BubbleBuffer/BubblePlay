[package]
name = "bubbleplay-host"
version = "0.1.0"
edition = "2021"
description = "BubblePlay streaming host: DXGI capture -> NVENC -> str0m WebRTC"
license = "AGPL-3.0-or-later"
build = "build.rs"

[dependencies]
bp-device-key = { path = "../crates/bp-device-key", features = ["phase2", "keygen"] }
windows-capture = "2.0.0"
nvidia-video-codec-sdk = "0.4.0"
# Select CUDA bindings before the SDK's auto-detection feature can invoke nvcc.
# CUDA 12.6 matches the local toolkit; the driver library is loaded at runtime.
cudarc = { version = "=0.16.6", default-features = false, features = ["cuda-12060", "driver", "std", "dynamic-loading"] }
str0m = "0.21.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
] }
windows-service = "0.8.1"
windows-core = "0.62.2"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
png = "0.18"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opus = "0.4.0"
# Device key files (host/src/device_key.rs). Exact pins: the key file format is a
# compatibility contract, so these do not float within a caret range.
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
sha2 = "=0.10.9"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[profile.release]
lto = "thin"

[workspace]
