# Phone APK on the home server, same path as Notes: build01 builds the unsigned
# release APK and streams it over SSH to the publish host, which aligns, release-signs
# with the BubblePlay key and publishes it to the private F-Droid repo. Neither
# the PC keystore nor a GitHub artifact or secret is involved.
name: android-apk

on:
  workflow_dispatch:
  # Every master push that passes Checks goes to the phone. Rapid merges
  # collapse: a newer run cancels the older one (concurrency below).
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # workflow_run fires in this repository's context even when the triggering
    # run came from a fork, so require a successful Checks push run on this
    # repository's own master before anything reaches build01 and the phone.
    if: >-
      github.repository == 'BubbleBuffer/BubblePlay' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == 'BubbleBuffer/BubblePlay'))
    runs-on: [self-hosted, build01]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The commit Checks passed on, not whatever master is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build unsigned release APK
        working-directory: android
        # No keystore.properties on build01, so assembleRelease leaves the APK
        # unsigned; versionCode defaults to epoch minutes (app/build.gradle.kts).
        # android/gradlew is committed without the executable bit, so run it via bash.
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Sign and publish
        working-directory: android
        env:
          APK_PUBLISH_SSH: ${{ vars.APK_PUBLISH_SSH }}
          APK_PUBLISH_KEY: ${{ vars.APK_PUBLISH_KEY }}
        run: |
          for name in APK_PUBLISH_SSH APK_PUBLISH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repository variable is empty: $name (set APK_PUBLISH_SSH and APK_PUBLISH_KEY; see docs/development.md)"; exit 1; fi
          done
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "$APK_PUBLISH_KEY" "$APK_PUBLISH_SSH" 'apk-publish bubbleplay' \
            < app/build/outputs/apk/release/app-release-unsigned.apk
