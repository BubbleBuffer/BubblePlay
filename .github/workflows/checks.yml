name: Checks

on:
  push:
    branches: [master, "lane/**"]
  pull_request:
    branches: [master, "lane/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a lane branch cancels its older run, so superseded runs don't hold build01 runners.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/lane/') }}

jobs:
  browser:
    runs-on: [self-hosted, build01]
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    # Rust relay lane pushes only need the relay-rs job; the full suite runs on PRs to master.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/heads/lane/rust-relay')
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci --ignore-scripts
      - run: node tools/check.mjs client
      - run: node --test tools/tests/*.test.mjs

  windows-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package allowlist and reproducibility
        shell: pwsh
        run: ./tools/tests/package-release.test.ps1
      - name: Fresh-install credential validation
        shell: pwsh
        run: ./host/scripts/test-setup-credentials.ps1
      - name: Explicit Worker and password validation
        shell: pwsh
        run: ./worker/tools/test-set-app-password.ps1
      - name: Windows PowerShell compatibility
        shell: powershell
        run: |
          ./tools/tests/package-release.test.ps1
          ./host/scripts/test-setup-credentials.ps1
          ./worker/tools/test-set-app-password.ps1

  relay:
    runs-on: [self-hosted, build01]
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    # Rust relay lane pushes only need the relay-rs job; the full suite runs on PRs to master.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/heads/lane/rust-relay')
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: relay/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Container build
        working-directory: .
        run: docker build -f relay/Dockerfile -t bubbleplay-relay:check .

  relay-rs:
    runs-on: [self-hosted, build01]
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown --no-self-update
          # Pin the toolchain for this job only. Jobs from other repos share RUSTUP_HOME on build01
          # and can change the global default mid-run, so `rustup default` is not enough.
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN=1.97.1
          # Runners on build01 share RUSTUP_HOME, so rustup can report the wasm32 target
          # installed while its rlibs are missing. Check the sysroot and reinstall if so.
          sysroot="$(rustc +1.97.1 --print sysroot)"
          if ! ls "$sysroot"/lib/rustlib/wasm32-unknown-unknown/lib/libcore-*.rlib >/dev/null 2>&1; then
            echo "wasm32 rust-std missing from $sysroot; reinstalling"
            rustup component remove rust-std --target wasm32-unknown-unknown --toolchain 1.97.1 || true
            rustup target add wasm32-unknown-unknown --toolchain 1.97.1
            ls "$sysroot"/lib/rustlib/wasm32-unknown-unknown/lib/libcore-*.rlib
          fi
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            relay-rs -> target
            relay-rs/worker -> target
            crates/bp-device-key -> target
      # The browser job is skipped on lane/rust-relay*, so check the shared fixture's JS contract test here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Device-key fixture contract (JS)
        run: node --test tools/tests/device-keys-contract.test.mjs
      - name: bp-device-key tests, clippy and fmt
        working-directory: crates/bp-device-key
        run: |
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: relay-rs tests, clippy and fmt
        working-directory: relay-rs
        run: |
          cargo test --locked --workspace --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: bp-relay-core builds for wasm32
        working-directory: relay-rs
        run: cargo check --locked -p bp-relay-core --target wasm32-unknown-unknown
      # worker-build 0.8.7 is the line that matches workers-rs (worker =0.8.7 in relay-rs/worker/Cargo.toml).
      # Published 2026-09-25, so it is at least two weeks old on 2026-10-23. Reinstalled only when
      # the installed version differs, so a warm runner skips the compile.
      - name: Install worker-build (pinned)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          WORKER_BUILD_VERSION=0.8.7
          if [ "$(worker-build --version 2>/dev/null | awk '{print $NF}' || true)" != "$WORKER_BUILD_VERSION" ]; then
            cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
          fi
          worker-build --version
      - name: bp-relay-worker clippy (wasm32) and fmt
        working-directory: relay-rs/worker
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo fmt --check
      - name: bp-relay-worker builds (worker-build --release)
        working-directory: relay-rs/worker
        run: worker-build --release
      # wrangler 4.148.0 was published 2026-10-06: the newest release at least two weeks old on
      # 2026-10-23 (4.149.0 is 13.9 days old). The crate has no lockfile for wrangler, so the exact pin is the guarantee.
      - name: Install wrangler (pinned)
        working-directory: relay-rs/worker
        run: npm install --no-save --no-audit --no-fund wrangler@4.148.0
      - name: bp-relay-worker tests (wrangler dev, local workerd)
        working-directory: relay-rs/worker
        run: node --test 'tests/*.test.mjs'
      - name: Container build
        run: docker build -f relay-rs/Dockerfile -t bubbleplay-relay-rs:check .

  host:
    name: Host checks (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Read by the nvidia-video-codec-sdk build script. Set for every step, because
      # clippy and fmt run cargo from the repo root, which skips host/.cargo/config.toml.
      NVIDIA_VIDEO_CODEC_SDK_PATH: ${{ github.workspace }}/host/sdk-stub/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.97.1
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: host -> target
      - name: Fetch locked crates
        run: cargo fetch --locked --manifest-path host/Cargo.toml
      - name: Create NVENC and NVDEC import libraries
        # The hosted runner has no NVIDIA driver, so there are no driver DLLs to dump.
        # Import libraries are built from the export names (same lists as the local
        # host/sdk-stub). Test binaries never load the DLLs: linking only records them.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio with C++ tools found.' }
          $msvc = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $lib = Join-Path $msvc.FullName 'bin\Hostx64\x64\lib.exe'
          $out = Join-Path $PWD 'host/sdk-stub'
          New-Item -ItemType Directory -Force $out | Out-Null
          $libraries = [ordered]@{
            nvEncodeAPI = @{ dll = 'nvEncodeAPI64'; exports = 'NvEncodeAPICreateInstance NvEncodeAPIGetMaxSupportedVersion NvToolCreateInterface NvToolDestroyInterface NvToolGetApiFunctionCount NvToolGetApiID NvToolGetApiNames NvToolGetInterface NvToolSetApiID NvToolSetInterface' }
            nvcuvid = @{ dll = 'nvcuvid'; exports = 'CreateEncoderInterface NvToolCreateInterface NvToolDestroyInterface NvToolGetApiFunctionCount NvToolGetApiID NvToolGetApiNames NvToolGetInterface NvToolSetApiID NvToolSetInterface __std_2U4S4U_X08 __std_4U4S4U_X04 cuvidConvertYUVToRGB cuvidConvertYUVToRGBArray cuvidCreateDecoder cuvidCreateVideoParser cuvidCreateVideoSource cuvidCreateVideoSourceW cuvidCtxLock cuvidCtxLockCreate cuvidCtxLockDestroy cuvidCtxUnlock cuvidDecodePicture cuvidDestroyDecoder cuvidDestroyVideoParser cuvidDestroyVideoSource cuvidGetDecodeStatus cuvidGetDecoderCaps cuvidGetSourceAudioFormat cuvidGetSourceVideoFormat cuvidGetVideoFrameSurface cuvidGetVideoSourceState cuvidMapVideoFrame cuvidMapVideoFrame64 cuvidParseVideoData cuvidPrivateOp cuvidReconfigureDecoder cuvidSetVideoSourceState cuvidUnmapVideoFrame cuvidUnmapVideoFrame64' }
          }
          foreach ($name in $libraries.Keys) {
            $def = Join-Path $out "$name.def"
            @("LIBRARY $($libraries[$name].dll)", 'EXPORTS') + ($libraries[$name].exports -split ' ') | Set-Content -Path $def -Encoding ascii
            & $lib /def:$def /machine:x64 /nologo "/out:$(Join-Path $out "$name.lib")"
            if ($LASTEXITCODE -ne 0) { throw "lib.exe failed for $name" }
          }
      - name: Host tests and cargo check
        run: node tools/check.mjs host
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --offline --manifest-path host/Cargo.toml --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --manifest-path host/Cargo.toml --all -- --check

  client-win:
    name: Windows client checks (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.97.1
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client-win -> target
      - name: Fetch locked crates
        run: cargo fetch --locked --manifest-path client-win/Cargo.toml
      - name: Client tests (unit, session contracts and UI layout snapshots)
        run: cargo test --locked --offline --manifest-path client-win/Cargo.toml
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --offline --manifest-path client-win/Cargo.toml --all-targets -- -D warnings
      - name: Rustfmt
        # The frozen mock UI (src/ui, src/mock.rs, src/model.rs, tests/ui_layout.rs) predates
        # this check and is skipped: main.rs marks those modules #[rustfmt::skip] and the
        # check starts at main.rs rather than covering every target.
        run: rustfmt --check --edition 2021 client-win/src/main.rs

  android:
    name: Android unit tests and lint (build01)
    runs-on: [self-hosted, build01]
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    # Rust relay lane pushes only need the relay-rs job; the full suite runs on PRs to master.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/heads/lane/rust-relay')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Gradle unit tests and lint
        working-directory: android
        # android/gradlew is committed without the executable bit (mode 100644), so run it via bash.
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug
