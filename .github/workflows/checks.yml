name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci --ignore-scripts
      - run: node tools/check.mjs client
      - run: node --test tools/tests/*.test.mjs

  windows-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package allowlist and reproducibility
        shell: pwsh
        run: ./tools/tests/package-release.test.ps1
      - name: Fresh-install credential validation
        shell: pwsh
        run: ./host/scripts/test-setup-credentials.ps1
      - name: Explicit Worker and password validation
        shell: pwsh
        run: ./worker/tools/test-set-app-password.ps1
      - name: Windows PowerShell compatibility
        shell: powershell
        run: |
          ./tools/tests/package-release.test.ps1
          ./host/scripts/test-setup-credentials.ps1
          ./worker/tools/test-set-app-password.ps1

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: relay/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Container build
        working-directory: .
        run: docker build -f relay/Dockerfile -t bubbleplay-relay:check .
