name: Checks

on:
  push:
    branches: [master, "lane/**"]
  pull_request:
    branches: [master, "lane/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push or PR update cancels its older run, so superseded runs don't hold runners. Master runs always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Which jobs a change needs (tools/ci-changes.mjs). Runs on build01 (hosted minutes are spent); a skipped job
  # reports as skipped. Master pushes and manual runs always run everything.
  changes:
    runs-on: [self-hosted, build01]
    timeout-minutes: 5
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      browser: ${{ steps.filter.outputs.browser }}
      e2e: ${{ steps.filter.outputs.e2e }}
      host: ${{ steps.filter.outputs.host }}
      client: ${{ steps.filter.outputs.client }}
      android: ${{ steps.filter.outputs.android }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || (github.event_name == 'push' && github.ref != 'refs/heads/master' && 'master') || '' }}
        run: node tools/ci-changes.mjs "$BASE"

  browser:
    runs-on: [self-hosted, build01]
    needs: changes
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    # Rust relay lane pushes only need the relay-rs job; the full suite runs on PRs to master.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/heads/lane/rust-relay') && needs.changes.outputs.browser == 'true'
    strategy:
      matrix:
        # One Node version on pull requests, both on master and manual runs.
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[24]' || '[22, 24]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci --ignore-scripts
      - run: node tools/check.mjs client
      - name: Lint gates (shrink-only baselines)
        if: matrix.node == 24
        run: node tools/lint/gates.mjs
      - run: node --test tools/tests/*.test.mjs

  windows-packaging:
    runs-on: windows-latest
    needs: changes
    # GitHub-hosted Windows minutes are billed and the budget is spent: manual runs only. Changes here are gated
    # by the local .claude/dk2/win-check.sh run (docs/development.md) until a self-hosted Windows runner exists.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.packaging == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package allowlist and reproducibility
        shell: pwsh
        run: ./tools/tests/package-release.test.ps1
      - name: Fresh-install credential validation
        shell: pwsh
        run: ./host/scripts/test-setup-credentials.ps1
      - name: Windows PowerShell compatibility
        shell: powershell
        run: |
          ./tools/tests/package-release.test.ps1
          ./host/scripts/test-setup-credentials.ps1

  relay-rs:
    runs-on: [self-hosted, build01]
    needs: changes
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.relay == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown --no-self-update
          # Pin the toolchain for this job only. Jobs from other repos share RUSTUP_HOME on build01
          # and can change the global default mid-run, so `rustup default` is not enough.
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN=1.97.1
          # Runners on build01 share RUSTUP_HOME, so rustup can report the wasm32 target
          # installed while its rlibs are missing. Check the sysroot and reinstall if so.
          sysroot="$(rustc +1.97.1 --print sysroot)"
          if ! ls "$sysroot"/lib/rustlib/wasm32-unknown-unknown/lib/libcore-*.rlib >/dev/null 2>&1; then
            echo "wasm32 rust-std missing from $sysroot; reinstalling"
            rustup component remove rust-std --target wasm32-unknown-unknown --toolchain 1.97.1 || true
            rustup target add wasm32-unknown-unknown --toolchain 1.97.1
            ls "$sysroot"/lib/rustlib/wasm32-unknown-unknown/lib/libcore-*.rlib
          fi
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            relay-rs -> target
            relay-rs/worker -> target
            crates/bp-device-key -> target
      # The browser job is skipped on lane/rust-relay*, so check the shared fixture's JS contract test here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Device-key fixture contract (JS)
        run: node --test tools/tests/device-keys-contract.test.mjs
      - name: Vendored shared device-key fixture is intact
        run: node tools/device-keys/gen-contract.mjs --check
      - name: bp-device-key tests, clippy and fmt
        working-directory: crates/bp-device-key
        run: |
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: relay-rs tests, clippy and fmt
        working-directory: relay-rs
        run: |
          cargo test --locked --workspace --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: Clippy ratchet (relay-rs, bp-device-key)
        run: |
          # Both gates run even if the first fails, so one run shows every miss.
          status=0
          node tools/lint/gates.mjs clippy relay-rs || status=1
          node tools/lint/gates.mjs clippy bp-device-key || status=1
          exit $status
      - name: bp-relay-core builds for wasm32
        working-directory: relay-rs
        run: cargo check --locked -p bp-relay-core --target wasm32-unknown-unknown
      # worker-build 0.8.7 is the line that matches workers-rs (worker =0.8.7 in relay-rs/worker/Cargo.toml).
      # Published 2026-09-25, so it is at least two weeks old on 2026-10-23. Reinstalled only when
      # the installed version differs, so a warm runner skips the compile.
      - name: Install worker-build (pinned)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          WORKER_BUILD_VERSION=0.8.7
          if [ "$(worker-build --version 2>/dev/null | awk '{print $NF}' || true)" != "$WORKER_BUILD_VERSION" ]; then
            cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
          fi
          worker-build --version
      - name: bp-relay-worker clippy (wasm32) and fmt
        working-directory: relay-rs/worker
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo fmt --check
      - name: Clippy ratchet (relay worker)
        if: ${{ !cancelled() }}
        run: node tools/lint/gates.mjs clippy relay-worker
      - name: bp-relay-worker builds (worker-build --release)
        working-directory: relay-rs/worker
        run: worker-build --release
      # The bundle CI built and tested, stamped like tools/deploy-relay.mjs stamps it, so a deploy can use
      # exactly this one: node tools/deploy-relay.mjs --config <wrangler.prod.toml> --skip-build.
      - name: Stamp and keep the tested relay bundle
        run: |
          worker_build="$(sed -n 's/^worker = "=\(.*\)"/\1/p' relay-rs/worker/Cargo.toml)"
          printf '{"commit":"%s","builtAt":"%s","workerBuild":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$worker_build" > relay-rs/worker/build/BUILD_INFO.json
      # Only master builds are deployed, so pull requests do not spend artifact storage (a full quota failed
      # a green relay job on a host-only PR).
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: relay-worker-bundle
          path: relay-rs/worker/build/
          if-no-files-found: error
          retention-days: 3
      # wrangler 4.148.0 was published 2026-10-06: the newest release at least two weeks old on
      # 2026-10-23 (4.149.0 is 13.9 days old). The crate has no lockfile for wrangler, so the exact pin is the guarantee.
      - name: Install wrangler (pinned)
        working-directory: relay-rs/worker
        run: npm install --no-save --no-audit --no-fund wrangler@4.148.0
      - name: bp-relay-worker tests (wrangler dev, local workerd)
        working-directory: relay-rs/worker
        # One test file at a time: each file starts its own wrangler dev, and when two start at once
        # one workerd fails to bind ("bind(): Address already in use").
        run: node --test --test-concurrency=1 'tests/*.test.mjs'
      - name: Container build
        run: docker build -f relay-rs/Dockerfile -t bubbleplay-relay-rs:check .

  browser-e2e:
    runs-on: [self-hosted, build01]
    needs: changes
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.e2e == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          # Pinned for this job only, as in the relay-rs job: runners share RUSTUP_HOME.
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: relay-rs -> target
          # Runners on build01 share one ~/.cargo, so the cache must not clean ~/.cargo/bin.
          cache-bin: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci --ignore-scripts
      - name: Build the relay binary
        working-directory: relay-rs
        run: cargo build --locked -p bp-relay-server --bin bp-relay
      - name: Browser viewer against the native relay
        run: node --test worker/test-e2e/*.test.mjs

  host:
    name: Host checks (windows-latest)
    runs-on: windows-latest
    needs: changes
    # GitHub-hosted Windows minutes are billed and the budget is spent: manual runs only. Changes here are gated
    # by the local .claude/dk2/win-check.sh run (docs/development.md) until a self-hosted Windows runner exists.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.host == 'true'
    timeout-minutes: 30
    env:
      # Read by the nvidia-video-codec-sdk build script. Set for every step, because
      # clippy and fmt run cargo from the repo root, which skips host/.cargo/config.toml.
      NVIDIA_VIDEO_CODEC_SDK_PATH: ${{ github.workspace }}/host/sdk-stub/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.97.1
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: host -> target
          # Keep the runner's shared ~/.cargo/bin: cache-bin deletes rustup on build01.
          cache-bin: "false"
      - name: Fetch locked crates
        run: cargo fetch --locked --manifest-path host/Cargo.toml
      - name: Create NVENC and NVDEC import libraries
        # The hosted runner has no NVIDIA driver, so there are no driver DLLs to dump.
        # Import libraries are built from the export names (same lists as the local
        # host/sdk-stub). Test binaries never load the DLLs: linking only records them.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio with C++ tools found.' }
          $msvc = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $lib = Join-Path $msvc.FullName 'bin\Hostx64\x64\lib.exe'
          $out = Join-Path $PWD 'host/sdk-stub'
          New-Item -ItemType Directory -Force $out | Out-Null
          $libraries = [ordered]@{
            nvEncodeAPI = @{ dll = 'nvEncodeAPI64'; exports = 'NvEncodeAPICreateInstance NvEncodeAPIGetMaxSupportedVersion NvToolCreateInterface NvToolDestroyInterface NvToolGetApiFunctionCount NvToolGetApiID NvToolGetApiNames NvToolGetInterface NvToolSetApiID NvToolSetInterface' }
            nvcuvid = @{ dll = 'nvcuvid'; exports = 'CreateEncoderInterface NvToolCreateInterface NvToolDestroyInterface NvToolGetApiFunctionCount NvToolGetApiID NvToolGetApiNames NvToolGetInterface NvToolSetApiID NvToolSetInterface __std_2U4S4U_X08 __std_4U4S4U_X04 cuvidConvertYUVToRGB cuvidConvertYUVToRGBArray cuvidCreateDecoder cuvidCreateVideoParser cuvidCreateVideoSource cuvidCreateVideoSourceW cuvidCtxLock cuvidCtxLockCreate cuvidCtxLockDestroy cuvidCtxUnlock cuvidDecodePicture cuvidDestroyDecoder cuvidDestroyVideoParser cuvidDestroyVideoSource cuvidGetDecodeStatus cuvidGetDecoderCaps cuvidGetSourceAudioFormat cuvidGetSourceVideoFormat cuvidGetVideoFrameSurface cuvidGetVideoSourceState cuvidMapVideoFrame cuvidMapVideoFrame64 cuvidParseVideoData cuvidPrivateOp cuvidReconfigureDecoder cuvidSetVideoSourceState cuvidUnmapVideoFrame cuvidUnmapVideoFrame64' }
          }
          foreach ($name in $libraries.Keys) {
            $def = Join-Path $out "$name.def"
            @("LIBRARY $($libraries[$name].dll)", 'EXPORTS') + ($libraries[$name].exports -split ' ') | Set-Content -Path $def -Encoding ascii
            & $lib /def:$def /machine:x64 /nologo "/out:$(Join-Path $out "$name.lib")"
            if ($LASTEXITCODE -ne 0) { throw "lib.exe failed for $name" }
          }
      - name: Install the secure helper for the hung-foreground test
        # host/tests/hung_foreground_input.rs sends input through the real host -> helper path.
        shell: pwsh
        run: |
          cargo build --locked --offline --manifest-path host/Cargo.toml --bin bubbleplay_secure_helper
          if ($LASTEXITCODE -ne 0) { throw 'secure helper build failed' }
          ./host/scripts/ci-install-secure-helper.ps1 -Exe host/target/debug/bubbleplay_secure_helper.exe
      - name: Host tests and cargo check
        env:
          # host/tests/hung_foreground_input.rs drives this runner's interactive desktop.
          BUBBLEPLAY_FOREGROUND_TESTS: "1"
        run: node tools/check.mjs host
      - name: Admin agent e2e (basic-user token)
        # Creates a local user: hosted runners only, never a self-hosted one.
        if: runner.environment == 'github-hosted'
        # The hosted runner account is an elevated administrator and the dev agent refuses to run
        # elevated, so `Host tests` skips these tests. Run them again as a standard user;
        # BUBBLEPLAY_E2E_REQUIRE_UNELEVATED turns a skip into a failure.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = cargo test --locked --offline --manifest-path host/Cargo.toml --test admin_agent_e2e --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'building admin_agent_e2e failed' }
          $exe = ($built | ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.executable -and $_.target.name -eq 'admin_agent_e2e' } | Select-Object -Last 1).executable
          if (-not $exe) { throw 'admin_agent_e2e executable not found' }
          # `runas /trustlevel` keeps TokenIsElevated on the hosted runner (UAC is off), so use a
          # throwaway local standard user that exists only for this step.
          $user = 'bpe2e'
          $plain = [guid]::NewGuid().ToString('N') + 'aA1!'
          # New-LocalUser, not `net user`: that one prompts for passwords over 14 characters.
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $plain -AsPlainText -Force) | Out-Null
          try {
            $dir = Split-Path $exe
            icacls $dir /grant "${user}:(OI)(CI)RX" /T /C | Out-Null
            $cred = [pscredential]::new($user, (ConvertTo-SecureString $plain -AsPlainText -Force))
            $log = Join-Path $env:RUNNER_TEMP 'admin-agent-e2e.log'
            icacls $env:RUNNER_TEMP /grant "${user}:(OI)(CI)M" | Out-Null
            # The standard user has no usable profile temp dir; give it one it can write.
            $scratch = Join-Path $env:RUNNER_TEMP 'bpe2e-tmp'
            New-Item -ItemType Directory -Force $scratch | Out-Null
            icacls $scratch /grant "${user}:(OI)(CI)F" | Out-Null
            $proc = Start-Process -FilePath $exe -ArgumentList '--test-threads=1' -Credential $cred -LoadUserProfile `
              -Environment @{ BUBBLEPLAY_E2E_REQUIRE_UNELEVATED = '1'; TEMP = $scratch; TMP = $scratch } `
              -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -WindowStyle Hidden
            if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw 'admin_agent_e2e did not finish in 5 minutes' }
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            if ($proc.ExitCode -ne 0) { throw "admin_agent_e2e failed with exit code $($proc.ExitCode)" }
          } finally {
            Remove-LocalUser -Name $user
          }
      - name: Remove the e2e user
        if: always() && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          net user bpe2e 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { net user bpe2e /delete }
          exit 0
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --offline --manifest-path host/Cargo.toml --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --manifest-path host/Cargo.toml --all -- --check
      - name: Clippy ratchet
        run: node tools/lint/gates.mjs clippy host -- --offline

  client-win:
    name: Windows client checks (windows-latest)
    runs-on: windows-latest
    needs: changes
    # GitHub-hosted Windows minutes are billed and the budget is spent: manual runs only. Changes here are gated
    # by the local .claude/dk2/win-check.sh run (docs/development.md) until a self-hosted Windows runner exists.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.client == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.97.1
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client-win -> target
      - name: Fetch locked crates
        run: cargo fetch --locked --manifest-path client-win/Cargo.toml
      - name: Client tests (unit, session contracts and UI layout snapshots)
        run: cargo test --locked --offline --manifest-path client-win/Cargo.toml
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --offline --manifest-path client-win/Cargo.toml --all-targets -- -D warnings
      - name: Clippy ratchet
        run: node tools/lint/gates.mjs clippy client-win -- --offline
      - name: Rustfmt
        # The frozen mock UI (src/ui, src/mock.rs, src/model.rs, tests/ui_layout.rs) predates
        # this check and is skipped: main.rs marks those modules #[rustfmt::skip] and the
        # check starts at main.rs rather than covering every target.
        run: rustfmt --check --edition 2021 client-win/src/main.rs

  android:
    name: Android unit tests and lint (build01)
    runs-on: [self-hosted, build01]
    needs: changes
    # build01 is a persistent self-hosted host: never run code from fork PRs on it.
    # Rust relay lane pushes only need the relay-rs job; the full suite runs on PRs to master.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/heads/lane/rust-relay') && needs.changes.outputs.android == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The relay e2e tests (android/app/src/test/.../e2e) run the viewer code against a real bp-relay.
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          # Pin the toolchain for this job only (build01 runners share RUSTUP_HOME).
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN=1.97.1
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: relay-rs -> target
      - name: Build bp-relay for the e2e tests
        working-directory: relay-rs
        run: |
          cargo build --locked -p bp-relay-server --bin bp-relay
          echo "BP_RELAY_SERVER_BIN=$PWD/target/debug/bp-relay" >> "$GITHUB_ENV"
      - name: Gradle unit tests and lint
        working-directory: android
        env:
          # A missing relay binary fails the e2e tests instead of skipping them.
          BP_E2E_REQUIRED: "1"
        # android/gradlew is committed without the executable bit (mode 100644), so run it via bash.
        # Retried twice: a transient registry error (429 and the like) must not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            bash ./gradlew --no-daemon testDebugUnitTest lintDebug && exit 0
            echo "Gradle attempt $attempt failed"; sleep $((attempt * 30))
          done
          exit 1
      # PNGs from ReadmeScreenshotTest (Robolectric renders of the app's screens), kept even when the tests fail.
      - name: Upload Android screenshots
        if: always()
        # A full artifact storage quota must not fail the tests.
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          if-no-files-found: error
          retention-days: 14
