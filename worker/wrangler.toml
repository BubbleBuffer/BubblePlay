name = "bubbleplay-relay"
preview_urls = true
main = "src/index.js"
compatibility_date = "2026-07-15"
compatibility_flags = ["enable_request_signal"]

[version_metadata]
binding = "WORKER_VERSION"

[vars]
SOURCE_URL = "https://github.com/BubbleBuffer/BubblePlay"
GATE_APPROVAL_TTL_SECONDS = "90"
# New-browser second factors: ntfy (the default), host, or ntfy,host.
# Host approval needs a connected host announcing browserApproval: true.
# APPROVAL_METHODS = "ntfy"
# Approval notifications: your own ntfy server and topic (NTFY_TOKEN is a secret).
# NTFY_URL = "https://ntfy.example.com"
# NTFY_TOPIC = "your-random-topic"
# Optional TURN relay (coturn REST credentials; TURN_SECRET is a secret).
# TURN is disabled while TURN_HOST is unset.
# TURN_HOST = "turn.example.com"

# Static hosting of the client page (worker/public/).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# One Durable Object per logical room: this relay hosts exactly one host and
# one client per room, and the room name is fixed for v0 (single session).
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "MEDIA_ROOM", class_name = "MediaRoom" },
  { name = "GATE", class_name = "ApprovalGate" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ApprovalGate"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MediaRoom"]
