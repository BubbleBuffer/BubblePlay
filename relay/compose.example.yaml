name: bubbleplay
services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: bubbleplay-relay:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["relay-data:/data"]
    tmpfs: ["/tmp:size=4m,mode=1777"]
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/bubbleplay-relay", "healthcheck", "--config", "/data/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [relay-net]
networks:
  relay-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
volumes:
  relay-data:
