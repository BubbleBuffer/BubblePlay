[package]
name = "bubbleplay-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "BubblePlay native Windows viewer"

[lib]
name = "bubbleplay_client"
path = "src/lib.rs"

[[bin]]
name = "bubbleplay-client"
path = "src/main.rs"
required-features = ["egui-client"]

[features]
# The egui window client (shell, ui, mock, and the windowed dev session). The Flutter app's
# core library builds with `default-features = false`.
default = ["egui-client"]
egui-client = ["dep:egui", "dep:egui-directx11", "dep:resvg", "dep:png"]

[dependencies]
# --- UI track: shell, ui, model, mock ---
# egui-directx11 0.13 pins egui 0.35 and windows 0.62; every D3D11 type the
# shell hands out (VideoLayer) comes from this windows version.
egui = { version = "0.35", optional = true }
egui-directx11 = { version = "0.13", optional = true }
resvg = { version = "0.48", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# --- end UI track ---

# --- plumbing ---
str0m = "0.21.0"
if-addrs = "0.15"
rand = "0.9"
socket2 = "0.6"
opus = "0.4.0"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
# Device keys: the viewer key file, the relay proof and IDs (docs/architecture/device-keys.md).
bp-device-key = { path = "../crates/bp-device-key", features = ["keygen", "keyfile", "phase2"] }
base64 = "0.22"
zeroize = "1"

# The same windows package as the shell; Cargo unions these target features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_UI_Input",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
] }
# --- end plumbing ---

[profile.release]
debug = "line-tables-only"

# The key-file KDF (Argon2id, 64 MiB, 3 passes) is far too slow unoptimised; the key-store
# tests and `key create --passphrase-prompt` in debug builds run it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# --- UI track: layout and snapshot tests ---
# TOML cannot reopen [dependencies]' neighbour table from inside the UI block
# above, so the UI test dependencies live in their own block here.
[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
# --- end UI track tests ---

# --- plumbing tests ---
# The relay end-to-end tests (src/session/relay_e2e_tests.rs) start the native relay in-process.
bp-relay-server = { path = "../relay-rs/server" }
# --- end plumbing tests ---
