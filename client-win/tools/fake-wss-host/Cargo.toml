# Local fake relay + host for WSS v4 end-to-end tests of the Windows client.
# Standalone on purpose: not a member of any workspace, its own lock file,
# and no dependency on the client crate. Build output goes to the shared
# client-win/target junction (CARGO_TARGET_DIR).
[package]
name = "fake-wss-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Loopback fake relay and host for WSS v4 (test tool, not shipped)"

[workspace]

[lib]
name = "fake_wss_host"
path = "src/lib.rs"

[[bin]]
name = "fake-wss-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bp-device-key = { path = "../../../crates/bp-device-key" }
futures-util = { version = "0.3", features = ["sink"] }
opus = "0.4.0"
# OS randomness for the register nonce and the media ticket. Pinned like
# bp-device-key's own copy, so the two resolve to one rand_core.
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
serde_json = "1"
str0m = { version = "0.21.0", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.28"

[profile.release]
debug = "line-tables-only"
