[package]
name = "decode-latency"
version = "0.1.0"
edition = "2021"
default-run = "decode-latency"

[[bin]]
name = "decode-latency"
path = "src/main.rs"

[[bin]]
name = "arrival-producer"
path = "src/arrival_producer.rs"

[workspace]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
  "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Performance",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Security"
] }
